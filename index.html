<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17051d">
<title>Mutrön</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head><body><main class="app">
<header><div class="brand">Mutr<span>ö</span>n</div><button class="icon-btn" id="menuBtn" aria-label="Settings">☰</button></header>
<div class="beats" id="beatLights"><i class="active"></i><i></i><i></i><i></i></div>
<section class="tempo"><button class="round" id="minus">−</button><div class="bpm-box"><input id="bpm" type="number" min="40" max="240" value="140" aria-label="BPM"></div><button class="round" id="plus">+</button></section><div class="bpm-label">BPM</div>
<section class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">READY</span></section>
<div class="drum-wrap"><button id="drum" class="drum" aria-label="Tap drum"><span class="drum-core"></span><span class="drum-label">TAP</span></button></div>
<section class="score"><div><small>SILENT STREAK</small><strong id="streak">0</strong><span id="streakUnit">bars</span></div><div><small>PERSONAL BEST</small><strong id="best">0</strong><span>bars</span></div></section>
<div class="feedback" id="feedback">Tap Start to begin</div>
<div class="controls"><button id="start" class="start">▶ START</button><button id="tapTempo" class="small">TAP TEMPO</button></div>
<footer><button class="bottom" id="meter">4/4</button><button class="bottom" id="settingsShortcut">⚙</button><button class="bottom" id="sound">♫</button></footer>
<div class="settings-panel" id="settingsPanel"><h2>Game settings</h2><label>Audible bars before silence <input id="audibleBars" type="number" min="1" max="16" value="4"></label><label>Time signature / beats per bar <select id="beats"><option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option><option value="6">6/8 (6 beats)</option></select></label><label>Difficulty <select id="difficulty"><option value="easy">Easy · ±150 ms</option><option value="medium" selected>Medium · ±100 ms</option><option value="hard">Hard · ±50 ms</option></select></label><p class="note">If a silent beat is missed, the metronome becomes audible for the selected bars before the next silent attempt.</p><button id="closeSettings" class="start">DONE</button></div>
</main><script src="game.js"></script><script src="register-sw.js"></script></body></html>
